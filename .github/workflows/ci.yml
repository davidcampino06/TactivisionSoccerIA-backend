# Runs the backend tests against a real PostgreSQL, built from the database repository
# (schema + migrations), with Row-Level Security on, exactly like the local setup:
#   <workspace>/backend            this repository
#   <workspace>/TactiSoccerIA-db   davidcampino06/TactiVisionSoccerIA-db
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tactivision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          path: backend

      - name: Esquema y migraciones (repositorio de la base de datos)
        uses: actions/checkout@v5
        with:
          repository: davidcampino06/TactiVisionSoccerIA-db
          path: TactiSoccerIA-db

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tactivision_test
